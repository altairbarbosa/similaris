name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable Windows executable
        shell: cmd
        run: build_windows.bat

      - name: Package Windows release folder
        shell: pwsh
        run: Compress-Archive -Path dist/windows/Similaris/* -DestinationPath dist/Similaris-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Similaris-Windows-x64
          path: dist/Similaris-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
