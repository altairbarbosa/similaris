name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build WinUI app with Python core
        shell: pwsh
        run: .\scripts\build_release_assets.ps1 -Version "${{ github.ref_name }}"

      - name: Upload public release assets
        uses: actions/upload-artifact@v4
        with:
          name: Similaris-public-release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload private Store package
        uses: actions/upload-artifact@v4
        with:
          name: Similaris-private-store-package
          path: dist/store-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Similaris-public-release-assets
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
